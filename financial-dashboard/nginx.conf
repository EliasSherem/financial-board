server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain application/javascript application/json text/css image/svg+xml;

  location / {
    try_files $uri /index.html;
  }

  # Proxy API requests to Cloud Run API to avoid CORS in production
  location /api/ {
    proxy_pass https://financial-api-hvy7vocg4a-uc.a.run.app;
    proxy_set_header Host financial-api-hvy7vocg4a-uc.a.run.app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name financial-api-hvy7vocg4a-uc.a.run.app;
  }

  # Cache static assets
  location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
